# Render Blueprint of the backend (D-10): one free web service that deploys
# `main` only after its CI checks pass. Secrets are never written here.
# Reference: Render docs, "Blueprint YAML Reference":
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hexablock-api
    runtime: node
    plan: free
    # Render's Virginia region; the Supabase project is in East US (North
    # Virginia, us-east-1), so queries stay inside one area. Of Render's
    # regions, it is the closest to the players in Latin America.
    region: virginia
    branch: main
    # Deploy a commit of `main` only when its GitHub checks (ci.yml) pass.
    autoDeployTrigger: checksPass
    # NODE_ENV=production makes `npm ci` skip devDependencies, but the build
    # needs the Nest CLI and the Prisma CLI, which are devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    # Free instances have no pre-deploy command, so the pending migrations
    # are applied at start. If one fails, the new version never becomes
    # healthy and Render keeps serving the previous one; but a migration that
    # failed halfway can leave the schema half changed, which must be fixed
    # by hand (README -> Deployment). This also runs on every wake from
    # sleep, adding a few seconds; with no pending migration it changes
    # nothing.
    startCommand: npx prisma migrate deploy && npm run start:prod
    # Render waits for a 2xx here before sending traffic to a new version.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Render's proxy is the only hop in front of the API.
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Origins of the admin panel allowed through CORS (comma list). For
      # now only its Vite dev server, so a teammate can run the panel on
      # their machine against this API; the panel's public origin is added
      # when it is deployed (client #77).
      - key: CORS_ORIGINS
        value: http://localhost:5173
      # A random value generated by Render on the first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Supabase session pooler URL, typed in Render's dashboard.
      - key: DATABASE_URL
        sync: false
