# Backend checks on every pull request and on every push to main
# (CONTRIBUTING §5, RNF-05). One job, so `main` needs a single required check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# On a pull request, a new push cancels the run that is still going. On
# `main` each commit gets its own group, so no run is cancelled or left
# waiting: Render deploys a commit only after its checks pass.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable database for migrations and e2e tests; never Supabase
    # (data-model §7). Destroyed when the job ends.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hexablock
          POSTGRES_PASSWORD: hexablock
          POSTGRES_DB: hexablock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexablock -d hexablock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Husky v9 does not skip on `CI=true`; without this, `npm ci` installs
      # git hooks the runner never uses.
      HUSKY: '0'
      DATABASE_URL: postgresql://hexablock:hexablock@localhost:5432/hexablock?schema=public
      TEST_DATABASE_URL: postgresql://hexablock:hexablock@localhost:5432/hexablock?schema=public

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          # Full history, so commitlint can read every commit of the PR.
          fetch-depth: 0
          # Do not leave the GitHub token in .git/config for later steps;
          # nothing here pushes.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx --no -- commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
